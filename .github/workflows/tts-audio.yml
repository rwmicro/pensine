name: Audio de prononciation

# Régénère les clips de prononciation vides ou manquants des notes de langues
# (sources/tts/script_TTS_langues.py --repair) et les commite sur main. Le texte
# des notes ne change pas : le mot, la langue et la voix sont relus dans le lien
# audio déjà présent. Sans clip cassé, aucun appel à l'API.
#
# Lancé à chaque push qui touche une note de langue, ou à la main (Actions →
# « Audio de prononciation » → Run workflow) ; le mode « surlignages » convertit
# en plus les nouveaux ==mot::code== en clips.
#
# Secret requis dans CE repo : ELEVENLABS_API_KEY. Sans lui, le job affiche une
# note et s'arrête. Les mp3 restent en git normal (pas LFS, quota épuisé).

on:
  push:
    branches: [main]
    paths: ["Social Sciences/Languages - Dialects/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "repair = clips vides/manquants ; surlignages = repair + nouveaux ==mot::code=="
        type: choice
        options: [repair, surlignages]
        default: repair

concurrency:
  group: tts-audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      LANGS: "Social Sciences/Languages - Dialects"
    steps:
      - name: Check the key
        id: key
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::notice::ELEVENLABS_API_KEY absent : aucun clip régénéré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # lfs: false (the default) — the .apkg decks stay as pointers, so this
      # job never spends the exhausted LFS bandwidth.
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: pip install elevenlabs langdetect

      - name: Repair empty or missing clips
        if: steps.key.outputs.ok == 'true'
        run: python sources/tts/script_TTS_langues.py --repair "$LANGS"

      - name: Convert new highlights
        if: steps.key.outputs.ok == 'true' && inputs.mode == 'surlignages'
        run: python sources/tts/script_TTS_langues.py "$LANGS"

      - name: Commit
        id: commit
        if: steps.key.outputs.ok == 'true'
        run: |
          rm -rf "$LANGS/.tts_audio_cache"
          git add -A -- "$LANGS"
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=$(git diff --cached --name-only -- '*.mp3' | wc -l)
          git commit -m "save: $(date +%d/%m/%Y) — audio de prononciation régénéré (${n} clip(s))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN doesn't start other workflows, so
      # rebuild-site.yml won't fire for this commit; ask the site directly.
      - name: Notify learn-nebula
        if: steps.commit.outputs.pushed == 'true'
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN absent : le site reprendra les clips à sa reconstruction nocturne."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rwmicro/learn-nebula/dispatches \
            -d '{"event_type":"pensine-updated"}'
